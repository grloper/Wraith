name: Bug report
description: Something behaves incorrectly (not a security vulnerability)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do NOT open a public issue. Use the private advisory flow described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Wraith version (`wraith --version`)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Distro, kernel (`uname -r`) and container/VM details
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `wraith doctor`
      render: text
