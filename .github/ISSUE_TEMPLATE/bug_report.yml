name: Reproducible bug or false positive
description: Report non-sensitive behavior with a minimal safe reproducer.
body:
  - type: markdown
    attributes:
      value: "For security bypasses or destructive issues, use SECURITY.md instead of public disclosure. Redact process metadata and secrets."
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Wraith revision/version, kernel, distribution and architecture
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal safe reproducer
      description: Exact invocation and local benign fixture; no real secrets or live targets
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
      description: Include redacted events, sensor status and target status
    validations:
      required: true
