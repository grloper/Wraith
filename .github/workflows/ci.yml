name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.74.0", "stable"]
    env:
      WRAITH_REQUIRE_PTRACE: "1"
      CARGO_TERM_COLOR: always
      # package_deb.sh otherwise derives maintainer identity from the HEAD commit
      # author; dependabot[bot] fails its e-mail validation. Configure repo variable DEBEMAIL.
      DEBFULLNAME: ${{ vars.DEBFULLNAME || 'grloper' }}
      DEBEMAIL: ${{ vars.DEBEMAIL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require maintainer identity
        run: |
          if [ -z "${DEBEMAIL}" ]; then
            echo "::error::Set repository variable DEBEMAIL (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
      - name: Install selected Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy --component rustfmt
          rustup default ${{ matrix.toolchain }}
      - name: Strict release verification
        run: bash scripts/verify.sh
      - name: Validate actual demo outcomes
        if: matrix.toolchain == 'stable'
        run: timeout 120 bash demo.sh
      - name: Verify package contents and build
        if: matrix.toolchain == 'stable'
        run: cargo package --locked
