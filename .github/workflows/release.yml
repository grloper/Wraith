name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned tool version; bump deliberately.
  CARGO_CYCLONEDX_VERSION: "0.5.9"

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DEBFULLNAME: ${{ vars.DEBFULLNAME || 'grloper' }}
      DEBEMAIL: ${{ vars.DEBEMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require maintainer identity
        run: |
          if [ -z "${DEBEMAIL}" ]; then
            echo "::error::Set repository variable DEBEMAIL (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')
          [ "$GITHUB_REF_NAME" = "v${version}" ] || { echo "::error::tag $GITHUB_REF_NAME != v${version}"; exit 1; }
      - name: Full quality gates
        run: bash scripts/verify.sh && timeout 120 bash demo.sh
      - name: Assemble sensor-only archive and checksums
        run: |
          bash scripts/package_release.sh
      - name: Build and exercise Debian-family package without host installation
        run: |
          bash scripts/test_deb.sh
      - name: Generate CycloneDX SBOM (pinned cargo-cyclonedx)
        run: |
          set -euo pipefail
          cargo install --locked --version "${CARGO_CYCLONEDX_VERSION}" cargo-cyclonedx
          cargo cyclonedx --format json --spec-version 1.5 --override-filename wraith-linux-x86_64.cdx
          mv wraith-linux-x86_64.cdx.json target/dist/
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' target/dist/wraith-linux-x86_64.cdx.json >/dev/null
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: wraith-linux-x86_64
          path: |
            target/dist/wraith-linux-x86_64.tar.gz
            target/dist/SHA256SUMS
            target/dist/wraith_*_amd64.deb
            target/dist/DebSHA256SUMS
            target/dist/wraith-linux-x86_64.cdx.json
          retention-days: 30
          if-no-files-found: error

  attest:
    # Build provenance for the tarball and .deb. Runs for tag pushes and for the
    # workflow_dispatch dry run (artifact-only: nothing is released).
    # id-token/attestations permissions are scoped to this job only.
    needs: linux-x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wraith-linux-x86_64
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/wraith-linux-x86_64.tar.gz
            dist/wraith_*_amd64.deb

  draft-release:
    # Only for tag pushes; workflow_dispatch remains an artifact-only dry run.
    # Creates a DRAFT release: a maintainer must review and publish it manually.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x86_64, attest]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -er '.packages[0].version')
          [ "$GITHUB_REF_NAME" = "v${version}" ] || { echo "::error::tag $GITHUB_REF_NAME != v${version}"; exit 1; }
      - name: Verify tagged commit is reachable from origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA ($GITHUB_REF_NAME) is not reachable from origin/main; refusing to draft a release"
            exit 1
          fi
      # download-artifact@v4 pairs with upload-artifact@v4 (same artifact backend)
      # used by the build job. If dependabot #12 bumps upload-artifact to v6,
      # bump this to download-artifact@v7 in the same change (v6 <-> v7, both node24).
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wraith-linux-x86_64
          path: dist
      - name: Verify exactly the expected release files exist
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          ls -l
          shopt -s nullglob
          debs=(wraith_*_amd64.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected exactly one wraith_*_amd64.deb, found ${#debs[@]}"; exit 1; }
          expected=$(printf '%s\n' DebSHA256SUMS SHA256SUMS wraith-linux-x86_64.cdx.json wraith-linux-x86_64.tar.gz "${debs[0]}" | sort)
          actual=$(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          [ "$expected" = "$actual" ] || { echo "::error::unexpected dist contents"; diff <(echo "$expected") <(echo "$actual") || true; exit 1; }
      - name: Verify checksums before attaching
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          sha256sum -c DebSHA256SUMS
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Draft release for $GITHUB_REF_NAME. Review CHANGELOG.md and SECURITY.md before publishing. Verify downloads with the attached checksums or with gh attestation verify (build provenance); a CycloneDX SBOM is attached." \
            dist/wraith-linux-x86_64.tar.gz dist/wraith_*_amd64.deb \
            dist/SHA256SUMS dist/DebSHA256SUMS dist/wraith-linux-x86_64.cdx.json
