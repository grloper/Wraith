name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DEBFULLNAME: ${{ vars.DEBFULLNAME || 'grloper' }}
      DEBEMAIL: ${{ vars.DEBEMAIL }}
    steps:
      - uses: actions/checkout@v7
      - name: Require maintainer identity
        run: |
          if [ -z "${DEBEMAIL}" ]; then
            echo "::error::Set repository variable DEBEMAIL (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - name: Validate tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'^version = "([^"]+)"', pathlib.Path('Cargo.toml').read_text(), re.M).group(1)
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'tag/package version mismatch'
          PY
      - name: Full quality gates
        run: bash scripts/verify.sh && timeout 120 bash demo.sh
      - name: Assemble sensor-only archive and checksums
        run: |
          bash scripts/package_release.sh
      - name: Build and exercise Debian-family package without host installation
        run: |
          bash scripts/test_deb.sh
      - uses: actions/upload-artifact@v6
        with:
          name: wraith-linux-x86_64
          path: |
            target/dist/wraith-linux-x86_64.tar.gz
            target/dist/SHA256SUMS
            target/dist/wraith_*_amd64.deb
            target/dist/DebSHA256SUMS
          retention-days: 30
          if-no-files-found: error

  draft-release:
    # Only for tag pushes; workflow_dispatch remains an artifact-only dry run.
    # Creates a DRAFT release: a maintainer must review and publish it manually.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux-x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag matches package version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = re.search(r'^version = "([^"]+)"', pathlib.Path('Cargo.toml').read_text(), re.M).group(1)
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'tag/package version mismatch'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: wraith-linux-x86_64
          path: dist
      - name: Verify checksums before attaching
        working-directory: dist
        run: |
          ls -l
          sha256sum -c SHA256SUMS
          sha256sum -c DebSHA256SUMS
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Draft release for $GITHUB_REF_NAME. Review CHANGELOG.md and SECURITY.md before publishing. Verify downloads with the attached checksums." \
            dist/wraith-linux-x86_64.tar.gz dist/wraith_*_amd64.deb \
            dist/SHA256SUMS dist/DebSHA256SUMS
