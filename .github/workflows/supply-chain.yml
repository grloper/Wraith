name: supply-chain

on:
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/supply-chain.yml"]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install cargo-audit and cargo-deny
        run: cargo install --locked cargo-audit cargo-deny
      - name: cargo audit (RustSec advisories)
        run: cargo audit
      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny check
